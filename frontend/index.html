<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">

    <!-- Header — now has a clear button on the right -->
    <header class="header">
      <div class="logo">YT</div>
      <div class="header-text">
        <h1 class="header-title">YouTube Chat</h1>
        <p class="header-sub">Ask anything about any video</p>
      </div>
      <!--
        This button lives on the right side of the header.
        margin-left: auto in CSS pushes it to the far right.
      -->
      <button class="btn-ghost" onclick="clearChat()" title="Clear conversation">
        Clear chat
      </button>
    </header>

    <!-- URL input panel — unchanged -->
    <section class="url-panel">
      <label class="url-label">Paste a YouTube URL to get started</label>
      <div class="url-row">
        <input
          type="text"
          id="url-input"
          class="url-input"
          placeholder="https://youtube.com/watch?v=..."
        />
        <button class="btn-primary" onclick="loadVideo()">Load video</button>
      </div>
      <div id="status-message" class="status-message hidden"></div>
    </section>

    <!-- Chat area — unchanged structure, JS fills it -->
    <section class="chat-area" id="chat-area">
      <div class="messages" id="messages">
        <div class="welcome-message" id="welcome-message">
          <p>Load a YouTube video above to start chatting.</p>
        </div>
      </div>
    </section>

    <!-- Input bar — unchanged -->
    <footer class="input-bar">
      <input
        type="text"
        id="question-input"
        class="question-input"
        placeholder="Ask something about this video…"
        onkeydown="handleEnter(event)"
      />
      <button class="btn-send" onclick="sendMessage()" aria-label="Send">
        &#8594;
      </button>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
